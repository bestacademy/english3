<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percakapan Sehari-hari Bahasa Inggris</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#dcfce7 2px, transparent 2px);
            background-size: 30px 30px;
        }
        .btn-topic {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-topic:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .is-pseudo-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            margin: 0 !important;
            border-radius: 0 !important;
            border: none !important;
            z-index: 99999 !important;
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden selection:bg-indigo-200">

    <div id="app" class="flex-grow flex flex-col relative w-full h-full max-w-6xl mx-auto bg-white shadow-2xl overflow-hidden sm:rounded-2xl sm:my-2 lg:my-4 sm:h-[calc(100vh-1rem)] lg:h-[calc(100vh-2rem)] border-4 border-emerald-200 transition-all duration-300">

                💬 English Conversation 💬
            </h1>
            <div class="flex items-center gap-2 sm:gap-3">
                <button id="btn-fullscreen" class="bg-white/20 hover:bg-white/30 active:scale-95 text-white font-bold py-1.5 px-3 rounded-full transition-all flex items-center gap-2 text-xs sm:text-sm border border-white/40 shadow-sm backdrop-blur-sm cursor-pointer">

        </header>

        <main class="flex-grow relative overflow-y-auto overflow-x-hidden p-4 sm:p-6 lg:p-8 bg-teal-50/30 flex flex-col">

                    <h2 class="text-2xl sm:text-4xl lg:text-5xl font-black text-teal-800 mb-2 drop-shadow-sm">Pilih Tema Percakapan!</h2>
                    <p class="text-teal-600 text-sm sm:text-base lg:text-lg mb-4 font-semibold">Belajar ungkapan & dialog bahasa Inggris sehari-hari.</p>
                    
                    <div class="flex flex-wrap justify-center items-center gap-2 sm:gap-3 bg-white/80 backdrop-blur-sm p-2 sm:p-3 rounded-2xl border-2 border-teal-100 max-w-2xl mx-auto shadow-sm">
                        <span class="font-black text-teal-900 text-xs sm:text-sm uppercase tracking-wide mr-1">Jenis Soal:</span>
                        <button id="btn-level-eng-indo" class="btn-level bg-green-500 text-white font-bold px-3 py-2 rounded-xl text-xs sm:text-sm shadow-md border-2 border-green-600 transform scale-105 transition-all cursor-pointer flex items-center gap-1">
                            <span>🇬🇧➔🇮🇩</span> Eng ➔ Indo

                        <button id="btn-level-indo-eng" class="btn-level bg-white text-gray-700 hover:bg-blue-100 font-bold px-3 py-2 rounded-xl text-xs sm:text-sm border-2 border-gray-200 transition-all cursor-pointer flex items-center gap-1">
                            <span>🇮🇩➔🇬🇧</span> Indo ➔ Eng
                        </button>
                        <button id="btn-level-medium" class="btn-level bg-white text-gray-700 hover:bg-yellow-100 font-bold px-3 py-2 rounded-xl text-xs sm:text-sm border-2 border-gray-200 transition-all cursor-pointer flex items-center gap-1">

                        </button>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 sm:gap-5 lg:gap-6 pb-6 my-auto max-w-4xl mx-auto w-full" id="topic-grid">
                </div>
            </div>

            <div id="quiz-view" class="w-full h-full hidden flex-col fade-in pb-16">

                <div class="bg-white rounded-3xl shadow-xl border-4 border-teal-100 p-6 sm:p-10 lg:p-12 flex-grow flex flex-col justify-center max-w-3xl mx-auto w-full relative overflow-hidden my-auto min-h-[300px]">

                    <div class="text-center my-auto py-2 sm:py-6 relative z-10">

                        <h3 class="text-2xl sm:text-3xl lg:text-4xl text-slate-800 tracking-wide font-black drop-shadow-sm my-4 sm:my-6 leading-relaxed px-2 whitespace-pre-line" id="question-word">
                            Pertanyaan

                    <div id="interaction-area" class="relative z-10 w-full flex flex-col items-center gap-4 mt-auto">

                            LIHAT JAWABAN

                            </div>
                        </div>
                    </div>
                </div>

                 <div class="absolute bottom-4 sm:bottom-6 left-0 right-0 flex justify-center px-4 pointer-events-none z-20">
                     <button id="btn-next" class="hidden pointer-events-auto w-full max-w-sm bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-black text-xl sm:text-2xl py-4 px-8 rounded-full shadow-[0_6px_0_rgb(49,46,129)] hover:shadow-[0_3px_0_rgb(49,46,129)] hover:translate-y-1 transform transition-all active:translate-y-2 active:shadow-none border-4 border-indigo-300 cursor-pointer">
                         LANJUT ➔

        <footer class="bg-teal-50 text-teal-800 text-center py-2 sm:py-3 text-xs sm:text-sm font-black border-t-2 border-teal-100 shrink-0 z-20">
            Created By : Best Academy - Conversation Edition
        </footer>
    </div>

    <script>

                    { q: "It is next to the post office.", eng: "Itu di sebelah kantor pos." },
                    { q: "Is it far from here?", eng: "Apakah itu jauh dari sini?" },
                    { q: "It is within walking distance.", eng: "Jaraknya bisa ditempuh dengan berjalan kaki." },
                    { q: "Cross the street carefully.", eng: "Seberangi jalan dengan hati-hati." },
                    { q: "The bank is across from the park.", eng: "Bank itu berada di seberang taman." },
                    { q: "Thank you for your help.", eng: "Terima kasih atas bantuan Anda." }
                ],
                medium: [
                    { q: "A: How do I get to the station?\nB: Just walk ........ blocks down this road.", eng: "two / three" },
                    { q: "The museum is located ........ the heart of the city.", eng: "in" },
                    { q: "You will see the bookstore ........ your right hand side.", eng: "on" },
                    { q: "A: Is there a gas station nearby?\nB: Yes, just around the ........ .", eng: "corner" },
                    { q: "Go past the supermarket and you'll ........ the school.", eng: "find / see" },
                    { q: "Sorry, I am a stranger here ........ as well.", eng: "myself" },

            'introducing_self': {
                easy: [
                    { q: "Hello, my name is John.", eng: "Halo, nama saya John." },
                    { q: "I am from Indonesia.", eng: "Saya berasal dari Indonesia." },

                    { q: "What is your hobby?", eng: "Apa hobimu?" },
                    { q: "My hobby is playing football.", eng: "Hobiku adalah bermain sepak bola." },

                    { q: "I am currently studying computer ........ at university.", eng: "science" },
                    { q: "Could you tell me a little bit ........ yourself?", eng: "about" },
                    { q: "I have been living in this city ........ five years.", eng: "for" },

        let currentTopicId = '';
        let currentTopic = null;
        let currentLevel = 'eng-indo'; // 'eng-indo', 'indo-eng', 'medium'
        let currentQuestionList = [];
        let previousQuestion = null;
        let isPseudoFullscreen = false;

        const menuView = document.getElementById('menu-view');
        const quizView = document.getElementById('quiz-view');
        const topicGrid = document.getElementById('topic-grid');
        
        const btnCloseQuiz = document.getElementById('btn-close-quiz');
        const currentTopicTitle = document.getElementById('current-topic-title');
        const questionWord = document.getElementById('question-word');
        const btnJawab = document.getElementById('btn-jawab');
        const answerRevealArea = document.getElementById('answer-reveal-area');
        const revealedAnswerText = document.getElementById('revealed-answer-text');
        const btnNext = document.getElementById('btn-next');
        const questionPromptLabel = document.getElementById('question-prompt-label');
        const quizLevelBadge = document.getElementById('quiz-level-badge');

        function initApp() {
            topicGrid.innerHTML = '';
            topics.forEach(topic => {
                const btn = document.createElement('button');
                btn.className = `${topic.color} text-white p-5 sm:p-6 rounded-3xl shadow-lg btn-topic flex flex-col items-center justify-center gap-3 sm:gap-4 border-4 border-white/50 cursor-pointer w-full h-full`;
                btn.innerHTML = `
                    <span class="text-4xl sm:text-5xl drop-shadow-md group-hover:scale-110 transition-transform">${topic.icon}</span>
                    <span class="font-black text-sm sm:text-base drop-shadow-md leading-tight text-center tracking-wide">${topic.title}</span>
                `;
                btn.onclick = () => startQuiz(topic.id);
                topicGrid.appendChild(btn);
            });

            document.getElementById('btn-level-eng-indo').onclick = () => setDifficultyLevel('eng-indo');
            document.getElementById('btn-level-indo-eng').onclick = () => setDifficultyLevel('indo-eng');
            document.getElementById('btn-level-medium').onclick = () => setDifficultyLevel('medium');
            
            btnCloseQuiz.onclick = returnToMenu;
            btnJawab.onclick = revealAnswer;
            btnNext.onclick = showNextQuestion;

            document.getElementById('btn-fullscreen').onclick = toggleFullscreen;
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        }

        function setDifficultyLevel(level) {
            currentLevel = level;
            const levels = [
                { id: 'eng-indo', el: document.getElementById('btn-level-eng-indo'), activeClass: 'bg-green-500 text-white border-green-600', inactiveClass: 'bg-white text-gray-700 border-gray-200 hover:bg-green-50' },
                { id: 'indo-eng', el: document.getElementById('btn-level-indo-eng'), activeClass: 'bg-blue-500 text-white border-blue-600', inactiveClass: 'bg-white text-gray-700 border-gray-200 hover:bg-blue-50' },
                { id: 'medium', el: document.getElementById('btn-level-medium'), activeClass: 'bg-yellow-500 text-white border-yellow-600', inactiveClass: 'bg-white text-gray-700 border-gray-200 hover:bg-yellow-50' }
            ];

            levels.forEach(lvl => {
                lvl.el.className = `btn-level font-bold px-3 py-2 rounded-xl text-xs sm:text-sm border-2 transition-all cursor-pointer flex items-center gap-1 ${lvl.id === level ? lvl.activeClass + ' transform scale-105 shadow-md' : lvl.inactiveClass}`;
            });
        }

        function startQuiz(topicId) {
            currentTopicId = topicId;
            currentTopic = topics.find(t => t.id === topicId);
            previousQuestion = null;
            
            // For easy/basic types, pull from 'easy' array, otherwise 'medium'
            const sourceKey = currentLevel === 'medium' ? 'medium' : 'easy';
            const allQs = questionBank[topicId][sourceKey];
            currentQuestionList = [...allQs];
            
            currentTopicTitle.innerText = currentTopic.title;
            
            if(currentLevel === 'eng-indo') {
                questionPromptLabel.innerText = "Terjemahkan ke Bahasa Indonesia:";
            } else if(currentLevel === 'indo-eng') {
                questionPromptLabel.innerText = "Terjemahkan ke Bahasa Inggris:";
            } else {
                questionPromptLabel.innerText = "Lengkapi percakapan / kalimat berikut:";
            }

            const badgeConfig = {
                'eng-indo': { color: 'green', icon: '🇬🇧➔🇮🇩', text: 'Eng ➔ Indo' },
                'indo-eng': { color: 'blue', icon: '🇮🇩➔🇬🇧', text: 'Indo ➔ Eng' },
                'medium': { color: 'yellow', icon: '🟡', text: 'Percakapan Mini' }
            }[currentLevel];
            
            quizLevelBadge.className = `bg-${badgeConfig.color}-500 text-white font-extrabold px-3 sm:px-4 py-1.5 sm:py-2 rounded-full border-2 border-${badgeConfig.color}-600 shadow-sm text-xs sm:text-sm uppercase flex items-center gap-1`;
            quizLevelBadge.innerHTML = `<span>${badgeConfig.icon}</span> ${badgeConfig.text}`;

            menuView.classList.add('hidden');
            quizView.classList.remove('hidden');
            quizView.classList.add('flex');
            
            showNextQuestion();
        }

        function getRandomQuestion() {
            if (currentQuestionList.length <= 1) return currentQuestionList[0];

            let nextQ;
            do {
                const randomIndex = Math.floor(Math.random() * currentQuestionList.length);
                nextQ = currentQuestionList[randomIndex];
            } while (previousQuestion && nextQ.q === previousQuestion.q);

            previousQuestion = nextQ;
            return nextQ;
        }

        function displayQuestion(qObj) {
            answerRevealArea.classList.add('hidden');
            btnJawab.classList.remove('hidden');
            btnNext.classList.add('hidden');
            btnNext.classList.remove('pointer-events-auto');
            
            if(currentLevel === 'eng-indo') {
                questionWord.innerText = qObj.q;
                revealedAnswerText.innerText = qObj.eng;
            } else if(currentLevel === 'indo-eng') {
                questionWord.innerText = qObj.eng;
                revealedAnswerText.innerText = qObj.q;
            } else {
                questionWord.innerText = qObj.q;
                revealedAnswerText.innerText = qObj.eng;
            }
        }

        function revealAnswer() {
            btnJawab.classList.add('hidden');
            answerRevealArea.classList.remove('hidden');
            
            btnNext.classList.remove('hidden');
            btnNext.classList.add('pointer-events-auto');
        }

        function showNextQuestion() {
            const nextQuestion = getRandomQuestion();
            displayQuestion(nextQuestion);
        }

        function returnToMenu() {
            quizView.classList.add('hidden');
            quizView.classList.remove('flex');
            
            menuView.classList.remove('hidden');
            menuView.classList.add('flex');
        }

        function toggleFullscreen() {
            const app = document.getElementById('app');
            if (!document.fullscreenElement && !isPseudoFullscreen) {
                if (app.requestFullscreen) {
                    app.requestFullscreen().catch(() => enablePseudoFullscreen(app));
                } else {
                    enablePseudoFullscreen(app);
                }
            } else {
                if (document.exitFullscreen && document.fullscreenElement) {
                    document.exitFullscreen();
                } else if (isPseudoFullscreen) {
                    disablePseudoFullscreen(app);
                }
            }
        }

        function enablePseudoFullscreen(app) {
            app.classList.add('is-pseudo-fullscreen');
            isPseudoFullscreen = true;
            updateFullscreenState();
        }

        function disablePseudoFullscreen(app) {
            app.classList.remove('is-pseudo-fullscreen');
            isPseudoFullscreen = false;
            updateFullscreenState();
        }

        function handleFullscreenChange() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                isPseudoFullscreen = false;
            }
            updateFullscreenState();
        }

        function updateFullscreenState() {
            const isFull = document.fullscreenElement || isPseudoFullscreen;
            document.getElementById('fullscreen-icon').innerText = isFull ? '⛕' : '⛶';
            document.getElementById('fullscreen-text').innerText = isFull ? 'Keluar Layar Penuh' : 'Layar Penuh';
        }

        window.onload = initApp;
    </script>
</body>
</html>
